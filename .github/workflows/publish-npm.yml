name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test before publishing
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token in Settings → Secrets."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          # Re-running a tag must not fail the run: a version is immutable on
          # npm, so if this one is already there there is nothing left to do.
          if npm view "openkodo@${version}" version >/dev/null 2>&1; then
            echo "openkodo@${version} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
