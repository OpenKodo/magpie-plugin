name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 20 and 22 are the
        # LTS lines host apps run today.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Package manifest builds
        run: npm run pack:check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed credentials
        run: |
          # Only real-looking secrets. `ok_live_...` placeholders in docs and
          # the documented key prefix are expected to appear.
          pattern='(ok_live_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|re_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'
          if grep -rEn "$pattern" --include='*.mjs' --include='*.js' --include='*.json' --include='*.md' --include='*.yml' .; then
            echo "::error::A credential-looking string was found. Remove it before merging."
            exit 1
          fi
          echo "No credential-looking strings found."

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the published tarball contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          for f in index.mjs v1.mjs v2.mjs README.md CHANGELOG.md LICENSE; do
            grep -q "$f" pack.txt || { echo "::error::$f missing from the package"; exit 1; }
          done
